name: Actualizar Cuadro de Mando

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # Objetivo: 20:30 Madrid. GitHub cron es UTC fijo → dos slots (CEST/CET).
    - cron: '30 18 * * *'   # 20:30 CEST (mar–oct)
    - cron: '30 19 * * *'   # 20:30 CET  (oct–mar)
    # Reintentos escalonados si el correo ERP llega tarde o GitHub retrasa el cron.
    - cron: '45 18 * * *'   # 20:45 verano
    - cron: '45 19 * * *'   # 20:45 invierno
    - cron: '00 19 * * *'   # 21:00 verano
    - cron: '00 20 * * *'   # 21:00 invierno
    - cron: '15 19 * * *'   # 21:15 verano
    - cron: '15 20 * * *'   # 21:15 invierno
    # El slot del huso contrario cae fuera de hora (p. ej. '30 18' = 19:30 en
    # invierno); el guard de hora minima lo descarta.
  workflow_dispatch:
    inputs:
      avisar_siempre:
        description: 'Enviar correo/Telegram aunque los datos no hayan cambiado'
        type: boolean
        default: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: actualizar-cuadro-pinturas
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 40

      - name: Omitir si es pronto o si ya se publicó hoy (hora Madrid + idempotencia)
        id: guard
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Ejecución manual: siempre corre."
            exit 0
          fi
          # Hora minima 20:30 Madrid: descarta el slot UTC del huso contrario,
          # que en invierno/verano caeria una hora antes de lo previsto.
          AHORA_MIN=$(( 10#$(TZ=Europe/Madrid date +%H) * 60 + 10#$(TZ=Europe/Madrid date +%M) ))
          INICIO_MIN=$(( 20 * 60 + 30 ))
          if (( AHORA_MIN < INICIO_MIN )); then
            echo "Son las $(TZ=Europe/Madrid date +%H:%M) en Madrid, antes de las 20:30. Se omite."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOY=$(TZ=Europe/Madrid date +%Y-%m-%d)
          HOY_TXT=$(TZ=Europe/Madrid date +%d/%m/%Y)
          YA=no
          while IFS='|' read -r subj ts; do
            [[ "$subj" != Auto\ * ]] && continue
            madrid_date=$(TZ=Europe/Madrid date -d "$ts" +%Y-%m-%d)
            madrid_hour=$(TZ=Europe/Madrid date -d "$ts" +%H)
            if [[ "$madrid_date" == "$HOY" && "$madrid_hour" -ge 18 ]]; then
              YA=yes
              break
            fi
          done < <(git log -40 --pretty=format:'%s|%cI')
          if [[ "$YA" == "yes" ]]; then
            echo "Ya publicado hoy en ventana vespertina ($HOY_TXT). Se omite este disparo programado."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin publicación vespertina de hoy ($HOY_TXT). Se ejecuta actualización."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar librerías
        if: steps.guard.outputs.skip != 'true'
        run: pip install openpyxl

      - name: Ejecutar script de actualización
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: Europe/Madrid
          GMAIL_EMAIL:      ${{ secrets.GMAIL_EMAIL }}
          GMAIL_PASSWORD:   ${{ secrets.GMAIL_PASSWORD }}
          GITHUB_TOKEN_HP:  ${{ secrets.GH_TOKEN_HP }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_USUARIO:   civcomercial2010-cmyk
          GITHUB_REPO:      cuadromandohpinturas
          AVISO_SIEMPRE:    ${{ inputs.avisar_siempre && '1' || '' }}
        run: python actualizar_gha.py

      - name: Comprobar que el cuadro publicado es V2
        if: steps.guard.outputs.skip != 'true'
        run: |
          grep -q 'id="page-ceo"' cuadro_mando.html || (echo "ERROR: cuadro_mando.html no es V2" && exit 1)
          grep -q 'Cuadro de Mando V2' cuadro_mando.html || (echo "ERROR: falta marca V2" && exit 1)
          grep -q 'AUTO_DATA_INJECT' cuadro_mando.html || (echo "ERROR: faltan datos inyectados" && exit 1)

      - name: Verificar publicación en GitHub Pages
        if: steps.guard.outputs.skip != 'true'
        run: |
          HOY=$(TZ=Europe/Madrid date +%d/%m/%Y)
          for i in 1 2 3 4 5; do
            BODY=$(curl -fsSL "https://civcomercial2010-cmyk.github.io/cuadromandohpinturas/cuadro_mando.html" || true)
            if echo "$BODY" | grep -q "actualizado.*$HOY"; then
              echo "OK Pages refleja actualización de hoy ($HOY)."
              exit 0
            fi
            echo "Esperando propagación Pages (intento $i)..."
            sleep 15
          done
          echo "AVISO: Pages aún no muestra fecha de hoy; el commit en repo puede estar correcto."
